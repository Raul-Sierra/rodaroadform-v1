<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RodaRoad form</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>Diari de Ruta</h1>
    <section id="driver">
      <h2>Conductor</h2>
      <label for="driverName">Nom del conductor</label>
      <input type="text" name="driverName" id="driverName" required />
      <label for="driverNumber">Número de conductor</label>
      <input type="text" name="driverNumber" id="driverNumber" required />
      <label for="dualDriving">
        <input type="checkbox" name="dualDriving" id="dualDriving" />
        Conducció doble
      </label>
    </section>
    <section id="vehicle">
      <h2>Vehicle</h2>

      <label for="truckNumber">Número de camió</label>
      <input type="text" name="truckNumber" id="truckNumber" required />

      <label for="tractorPlate">Matrícula tractora</label>
      <input type="text" name="tractorPlate" id="tractorPlate" required />

      <label for="trailerPlate">Matrícula remolc</label>
      <input type="text" name="trailerPlate" id="trailerPlate" required />

      <label for="refueled">Has fet repostatge</label>
      <select name="refueled" id="refueled">
        <option value="no">No</option>
        <option value="yes">Sí</option>
      </select>
      <div id="refuelSection">
        <label for="fuelLocation">Lloc del repostatge</label>
        <input type="text" name="fuelLocation" id="fuelLocation" />

        <label for="fuelDieselA">Gasoil A (litres)</label>
        <input
          type="number"
          name="fuelDieselA"
          id="fuelDieselA"
          min="0"
          step="0.01"
        />

        <label for="fuelDieselB">Gasoil B (litres)</label>
        <input
          type="number"
          name="fuelDieselB"
          id="fuelDieselB"
          min="0"
          step="0.01"
        />

        <label for="fuelAdBlue">AdBlue (litres)</label>
        <input
          type="number"
          name="fuelAdBlue"
          id="fuelAdBlue"
          min="0"
          step="0.01"
        />

        <label for="fuelGas">Gas (Kg)</label>
        <input type="number" name="fuelGas" id="fuelGas" min="0" step="0.01" />

        <label for="fuelKm">Quilómetres</label>
        <input type="number" name="fuelKm" id="fuelKm" />
      </div>
    </section>
    <section id="trip">
      <h2>Viatge</h2>
      <label for="client"> Client/Empresa </label>
      <input type="text" name="client" id="client" required />
      <label for="startCity"> Ciutat d'inici </label>
      <input type="text" name="startCity" id="startCity" required />
      <label for="startDate"> Data de sortida </label>
      <input type="date" name="startDate" id="startDate" required />
      <label for="startTime"> Hora de sortida </label>
      <input type="time" name="startTime" id="startTime" required />
      <label for="endCity"> Ciutat d'arribada </label>
      <input type="text" name="endCity" id="endCity" required />
      <label for="endDate"> Data d'arribada </label>
      <input type="date" name="endDate" id="endDate" required />
      <label for="endTime"> Hora d'arribada </label>
      <input type="time" name="endTime" id="endTime" required />
      <h3>Càrregues</h3>
      <div id="loadsContainer"></div>
      <button type="button" id="addLoad">Afegir càrrega</button>
      <h3>Descàrregues</h3>
      <div id="unloadsContainer"></div>
      <button type="button">Afegir descàrrega</button>
      <h3>Quilòmetres</h3>
      <label for="kmStart"> Quilòmetres inicials </label>
      <input type="number" name="kmStart" id="kmStart" required />
      <label for="kmEnd"> Quilòmetres finals </label>
      <input type="number" name="kmEnd" id=" kmEnd" required />
      <label for="kmTotal"> Quilòmetres totals </label>
      <input type="text" name="kmTotal" id="kmTotal" readonly />
      <label for="driveTime"> Temps de conducció </label>
      <input
        type="text"
        name="driveTime"
        id="driveTime"
        placeholder="ex: 8H30"
        required
      />
      <h3>Observacions</h3>
      <textarea
        name="observations"
        id="observations"
        rows="4"
        placeholder="Incidents, notes..."
      ></textarea>
      <h3>Adjunts</h3>
      <label for="fuelReceipts"> Tiquets de repostatge </label>
      <input
        type="file"
        name="fuelReceipts"
        id="fuelReceipts"
        accept="image/*"
        multiple
      />
      <label for="waybills"> Albarans </label>
      <input
        type="file"
        name="waybills"
        id="waybills"
        accept="image/*"
        multiple
      />
      <label for="otherDocs"> Altra documentació </label>
      <input
        type="file"
        name="otherDocs"
        id="otherDocs"
        accept="image/*"
        multiple
      />
    </section>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
