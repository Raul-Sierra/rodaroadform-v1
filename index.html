<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RodaRoad form</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="logo-icon">
        <i data-lucide="truck"></i>
      </div>
      <div>
        <h1>full de Ruta</h1>
        <p class="subtitle">Formulari de conductors</p>
      </div>
    </header>
    <section id="driver" class="form-section">
      <h2 class="section-title"><i data-lucide="user"></i> Conductor</h2>
      <label class="form__label" for="driverNumber"
        ><i data-lucide="hash"></i> Número de conductor</label
      >
      <input
        class="form__input"
        type="text"
        name="driverNumber"
        id="driverNumber"
        required
      />
      <label class="form__label" for="driverName"
        ><i data-lucide="badge"></i> Nom del conductor</label
      >
      <input
        class="form__input"
        type="text"
        name="driverName"
        id="driverName"
        required
      />
      <label class="form__label" for="dualDriving">
        <input
          class="form__input"
          type="checkbox"
          name="dualDriving"
          id="dualDriving"
        />
        Conducció doble
      </label>
      <div id="secondDriverInfo" class="second-driver-section">
        <label class="form__label" for="driverName2"
          ><i data-lucide="badge"></i> Nom 2n conductor</label
        >
        <input
          class="form__input"
          type="text"
          name="driverName2"
          id="driverName2"
        />
        <label class="form__label" for="driverNumber2"
          ><i data-lucide="hash"></i> Número 2n conductor</label
        >
        <input
          class="form__input"
          type="text"
          name="driverNumber2"
          id="driverNumber2"
        />
      </div>
    </section>
    <section id="vehicle" class="form-section">
      <h2 class="section-title"><i data-lucide="truck"></i> Vehicle</h2>

      <label class="form__label" for="truckNumber"
        ><i data-lucide="hash"></i> Número de camió</label
      >
      <input
        class="form__input"
        type="text"
        name="truckNumber"
        id="truckNumber"
        required
      />

      <label class="form__label" for="tractorPlate"
        ><i data-lucide="rectangle-horizontal"></i> Matrícula tractora</label
      >
      <input
        class="form__input"
        type="text"
        name="tractorPlate"
        id="tractorPlate"
        required
      />

      <label class="form__label" for="trailerPlate"
        ><i data-lucide="rectangle-horizontal"></i> Matrícula remolc</label
      >
      <input
        class="form__input"
        type="text"
        name="trailerPlate"
        id="trailerPlate"
        required
      />

      <label class="form__label" for="refueled"
        ><i data-lucide="fuel"></i> Has fet repostatge</label
      >
      <select class="form__input" name="refueled" id="refueled">
        <option value="no">No</option>
        <option value="yes">Sí</option>
      </select>
      <div id="refuelSection" class="refuel-section">
        <label class="form__label" for="fuelLocation"
          ><i data-lucide="map-pin"></i> Lloc del repostatge</label
        >
        <input
          class="form__input"
          type="text"
          name="fuelLocation"
          id="fuelLocation"
        />

        <label class="form__label" for="fuelDieselA"
          ><i data-lucide="droplets"></i> Gasoil A (litres)</label
        >
        <input
          class="form__input"
          type="number"
          name="fuelDieselA"
          id="fuelDieselA"
          min="0"
          step="0.01"
        />

        <label class="form__label" for="fuelDieselB"
          ><i data-lucide="droplets"></i> Gasoil B (litres)</label
        >
        <input
          class="form__input"
          type="number"
          name="fuelDieselB"
          id="fuelDieselB"
          min="0"
          step="0.01"
        />

        <label class="form__label" for="fuelAdBlue"
          ><i data-lucide="droplet"></i> AdBlue (litres)</label
        >
        <input
          class="form__input"
          type="number"
          name="fuelAdBlue"
          id="fuelAdBlue"
          min="0"
          step="0.01"
        />

        <label class="form__label" for="fuelGas"
          ><i data-lucide="flame"></i> Gas (Kg)</label
        >
        <input
          class="form__input"
          type="number"
          name="fuelGas"
          id="fuelGas"
          min="0"
          step="0.01"
        />

        <label class="form__label" for="fuelKm"
          ><i data-lucide="gauge"></i> Quilómetres</label
        >
        <input class="form__input" type="number" name="fuelKm" id="fuelKm" />
      </div>
    </section>
    <section id="trip" class="form-section">
      <h2 class="section-title"><i data-lucide="map-pin"></i> Viatge</h2>
      <label class="form__label" for="client"
        ><i data-lucide="building-2"></i> Client/Empresa</label
      >
      <input class="form__input" type="text" name="client" id="client" required />
      <label class="form__label" for="startCity"
        ><i data-lucide="map-pin"></i> Ciutat d'inici</label
      >
      <input
        class="form__input"
        type="text"
        name="startCity"
        id="startCity"
        required
      />
      <label class="form__label" for="startDate"
        ><i data-lucide="calendar"></i> Data de sortida</label
      >
      <input
        class="form__input"
        type="date"
        name="startDate"
        id="startDate"
        required
      />
      <label class="form__label" for="startTime"
        ><i data-lucide="clock"></i> Hora de sortida</label
      >
      <input
        class="form__input"
        type="time"
        name="startTime"
        id="startTime"
        required
      />
      <label class="form__label" for="endCity"
        ><i data-lucide="flag"></i> Ciutat d'arribada</label
      >
      <input
        class="form__input"
        type="text"
        name="endCity"
        id="endCity"
        required
      />
      <label class="form__label" for="endDate"
        ><i data-lucide="calendar-check"></i> Data d'arribada</label
      >
      <input
        class="form__input"
        type="date"
        name="endDate"
        id="endDate"
        required
      />
      <label class="form__label" for="endTime"
        ><i data-lucide="clock-3"></i> Hora d'arribada</label
      >
      <input
        class="form__input"
        type="time"
        name="endTime"
        id="endTime"
        required
      />
      <h3 class="section-subtitle">
        <i data-lucide="package-plus"></i> Càrregues
      </h3>
      <div id="loadsContainer"></div>
      <button type="button" id="addLoad" class="form-button">
        + Afegir càrrega
      </button>
      <h3 class="section-subtitle">
        <i data-lucide="package-minus"></i> Descàrregues
      </h3>
      <div id="unloadsContainer"></div>
      <button type="button" id="addUnload" class="form-button">
        + Afegir descàrrega
      </button>
      <h3 class="section-subtitle">
        <i data-lucide="gauge"></i> Quilòmetres
      </h3>
      <label class="form__label" for="kmStart"
        ><i data-lucide="play"></i> Quilòmetres inicials</label
      >
      <input
        class="form__input"
        type="number"
        name="kmStart"
        id="kmStart"
        required
      />
      <label class="form__label" for="kmEnd"
        ><i data-lucide="flag"></i> Quilòmetres finals</label
      >
      <input
        class="form__input"
        type="number"
        name="kmEnd"
        id="kmEnd"
        required
      />
      <label class="form__label" for="kmTotal"
        ><i data-lucide="route"></i> Quilòmetres totals</label
      >
      <input
        class="form__input"
        type="text"
        name="kmTotal"
        id="kmTotal"
        readonly
      />
      <label class="form__label" for="driveTime"
        ><i data-lucide="timer"></i> Temps de conducció</label
      >
      <input
        class="form__input"
        type="text"
        name="driveTime"
        id="driveTime"
        placeholder="ex: 8H30"
        required
      />
      <div id="secondDriverFields" class="second-driver-section">
        <label class="form__label" for="driveTime2"
          ><i data-lucide="timer"></i> Temps de conducció 2n conductor</label
        >
        <input
          class="form__input"
          type="text"
          name="driveTime2"
          id="driveTime2"
          placeholder="ex: 8H30"
        />
      </div>
      <label class="form__label" for="perDiemCountry"
        ><i data-lucide="earth"></i> Dieta / País</label
      >
      <select
        class="form__input"
        id="perDiemCountry"
        name="perDiemCountry"
        required
      >
        <option value="">Selecciona país</option>
      </select>
      <h3 class="section-subtitle">
        <i data-lucide="file-text"></i> Observacions
      </h3>
      <textarea
        class="form__input"
        name="observations"
        id="observations"
        rows="4"
        placeholder="Incidents, notes..."
      ></textarea>
      <h3 class="section-subtitle">
        <i data-lucide="paperclip"></i> Adjunts
      </h3>
      <label class="form__label" for="fuelReceipts"
        ><i data-lucide="receipt"></i> Tiquets de repostatge</label
      >
      <input
        class="form__input"
        type="file"
        name="fuelReceipts"
        id="fuelReceipts"
        accept="image/*"
        multiple
      />
      <label class="form__label" for="waybills"
        ><i data-lucide="file-check"></i> Albarans</label
      >
      <input
        class="form__input"
        type="file"
        name="waybills"
        id="waybills"
        accept="image/*"
        multiple
      />
      <label class="form__label" for="otherDocs"
        ><i data-lucide="folder-open"></i> Altra documentació</label
      >
      <input
        class="form__input"
        type="file"
        name="otherDocs"
        id="otherDocs"
        accept="image/*,.pdf"
        multiple
      />
    </section>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
